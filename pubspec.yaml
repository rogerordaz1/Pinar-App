name: cubamap
description: Encuentra productos disponibles en negocios cercanos en Cuba.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # Code Generation (runtime)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Backend
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^14.2.7

  # Functional Programming
  dartz: ^0.10.1

  # Images con cache
  cached_network_image: ^3.3.1

  # Localización del usuario
  geolocator: ^13.0.1

  # Conectividad
  connectivity_plus: ^6.0.3

  # Almacenamiento local
  shared_preferences: ^2.3.2

  # Mapas (preparado para v1.1)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  font_awesome_flutter: ^11.0.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^3.0.0
  json_serializable: ^6.8.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding/
